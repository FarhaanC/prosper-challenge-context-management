[pytest]
# Run from the backend folder (or point pytest at it): both test folders, with
# backend/ on the import path so `import clinic` works without path hacks.
testpaths = tests tests_independent
pythonpath = .
# The editor's browser tests need Playwright and a built editor; they run on their own
# (see the docstring in tests_independent/editor/browser/conftest.py).
addopts = --ignore=tests_independent/editor/browser
